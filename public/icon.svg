<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1d2e"/>
      <stop offset="100%" stop-color="#0f1117"/>
    </linearGradient>
    <linearGradient id="flag-pole" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="grad-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Subtle border -->
  <rect width="510" height="510" x="1" y="1" rx="114" fill="none" stroke="#2e3250" stroke-width="2"/>

  <!-- Globe ring / orbit accent -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#3b82f6" stroke-width="4" stroke-dasharray="16 12" opacity="0.3"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.2"/>

  <!-- Main Flag Graphic -->
  <g filter="url(#shadow)" transform="translate(130, 110)">
    <!-- Flag pole -->
    <rect x="20" y="20" width="14" height="260" rx="7" fill="url(#flag-pole)"/>
    <circle cx="27" cy="18" r="14" fill="url(#grad-gold)"/>

    <!-- Waving Flag Cloth -->
    <path d="M 34 32 C 100 10, 150 50, 220 30 C 230 27, 235 34, 235 44 L 235 150 C 165 170, 115 130, 34 152 Z" fill="url(#grad-red)"/>
    
    <!-- Flag stripes / design inside -->
    <path d="M 34 72 C 100 50, 150 90, 220 70 L 220 110 C 150 130, 100 90, 34 112 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M 34 112 C 100 90, 150 130, 220 110 L 220 150 C 150 170, 100 130, 34 152 Z" fill="url(#grad-blue)"/>

    <!-- Gold Star on the flag -->
    <polygon points="80,50 84,62 96,62 86,70 90,82 80,74 70,82 74,70 64,62 76,62" fill="url(#grad-gold)"/>
  </g>

  <!-- Sparkles -->
  <circle cx="390" cy="130" r="6" fill="#fbbf24"/>
  <circle cx="110" cy="380" r="5" fill="#60a5fa"/>
  <circle cx="410" cy="370" r="8" fill="#34d399"/>
</svg>
